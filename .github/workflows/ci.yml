name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.15"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check graylog_mcp tests
      - run: uv run mypy graylog_mcp
      - run: uv run pytest --cov=graylog_mcp --cov-report=term-missing
      - run: git diff --check
      - run: uv run pip-audit --strict

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:latest
          detect --source=/repo --no-banner --redact

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --pull --tag graylog-custom-mcp:ci .
      - run: docker compose --env-file example.env config --quiet
