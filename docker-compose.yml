services:
  graylog-mcp:
    build: .
    image: graylog-custom-mcp:local
    pull_policy: build
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # The application is reachable by Caddy over the private Compose network.
    # Its ports are intentionally not published on the host.
    volumes:
      - ./queries.yaml:/app/queries.yaml:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; [urllib.request.urlopen('http://127.0.0.1:' + os.environ.get(name, default) + '/health') for name,default in [('MCP_PORT','8000'),('WEBUI_PORT','8001')]]"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      graylog-mcp:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MCP_PORT: "${MCP_PORT:-8000}"
      MCP_PATH: "${MCP_PATH:-/mcp}"
      WEBUI_PORT: "${WEBUI_PORT:-8001}"
      CADDY_DOMAIN: "${CADDY_DOMAIN:-localhost}"
      CADDY_EMAIL: "${CADDY_EMAIL:-admin@example.com}"
      CADDY_WEBUI_HTTP_PORT: "${CADDY_WEBUI_HTTP_PORT:-8080}"
      CADDY_MCP_HTTP_PORT: "${CADDY_MCP_HTTP_PORT:-8081}"
      CADDY_WEBUI_HTTPS_PORT: "${CADDY_WEBUI_HTTPS_PORT:-443}"
      CADDY_MCP_HTTPS_PORT: "${CADDY_MCP_HTTPS_PORT:-8443}"
      CADDY_TLS_DIRECTIVE: "${CADDY_TLS_DIRECTIVE:-}"
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_WEBUI_HTTP_BIND:-127.0.0.1}:${CADDY_WEBUI_HTTP_PORT:-8080}:${CADDY_WEBUI_HTTP_PORT:-8080}"
      - "${CADDY_MCP_HTTP_BIND:-127.0.0.1}:${CADDY_MCP_HTTP_PORT:-8081}:${CADDY_MCP_HTTP_PORT:-8081}"
      - "${CADDY_WEBUI_BIND:-0.0.0.0}:${CADDY_WEBUI_HTTPS_PORT:-443}:${CADDY_WEBUI_HTTPS_PORT:-443}"
      - "${CADDY_MCP_BIND:-0.0.0.0}:${CADDY_MCP_HTTPS_PORT:-8443}:${CADDY_MCP_HTTPS_PORT:-8443}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ${CADDY_CERTS_DIR:-./caddy/certs}:/etc/caddy/certs:ro
