services:
  graylog-mcp:
    build: .
    image: graylog-custom-mcp:local
    pull_policy: build
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    volumes:
      - ./queries.yaml:/app/queries.yaml:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + __import__('os').environ.get('MCP_PORT', '8000') + '/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      graylog-mcp:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MCP_PORT: "${MCP_PORT:-8000}"
      CADDY_DOMAIN: "${CADDY_DOMAIN:-localhost}"
      CADDY_EMAIL: "${CADDY_EMAIL:-admin@example.com}"
      CADDY_WEBUI_HTTPS_PORT: "${CADDY_WEBUI_HTTPS_PORT:-443}"
      CADDY_MCP_HTTPS_PORT: "${CADDY_MCP_HTTPS_PORT:-8443}"
      CADDY_TLS_DIRECTIVE: "${CADDY_TLS_DIRECTIVE:-}"
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_WEBUI_BIND:-0.0.0.0}:${CADDY_WEBUI_HTTPS_PORT:-443}:${CADDY_WEBUI_HTTPS_PORT:-443}"
      - "${CADDY_MCP_BIND:-0.0.0.0}:${CADDY_MCP_HTTPS_PORT:-8443}:${CADDY_MCP_HTTPS_PORT:-8443}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ${CADDY_CERTS_DIR:-./caddy/certs}:/etc/caddy/certs:ro
